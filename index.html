<head>

    <link rel="stylesheet" href="assets/css/theme.css">

    <style>
        /* Main Layout Structure */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            background: var(--bg-primary);
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 100;
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        .sidebar.collapsed .sidebar-brand {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        .sidebar-brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c8c 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sidebar-collapse-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-collapse-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* Sidebar Menu */
        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
        }

        .sidebar-menu::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-menu::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-menu::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .sidebar-menu::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .menu-section {
            margin-bottom: 8px;
        }

        .menu-section-title {
            padding: 12px 12px 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-tertiary);
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
        }

        .sidebar.collapsed .menu-section-title {
            opacity: 0;
            height: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            user-select: none;
            white-space: nowrap;
            font-size: 14px;
            position: relative;
        }

        .menu-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .menu-item.active {
            background: linear-gradient(90deg, rgba(255, 107, 107, 0.2) 0%, transparent 100%);
            color: #ff6b6b;
            font-weight: 500;
        }

        .menu-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #ff6b6b;
            border-radius: 0 3px 3px 0;
        }

        .menu-item-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .menu-item-label {
            flex: 1;
            transition: opacity 0.3s ease;
        }

        .sidebar.collapsed .menu-item-label {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        /* Sidebar Footer */
        .sidebar-footer {
            padding: 12px 8px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-footer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .sidebar-footer-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-footer-item-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .sidebar-footer-item-label {
            flex: 1;
            transition: opacity 0.3s ease;
        }

        .sidebar.collapsed .sidebar-footer-item-label {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navbar */
        .navbar {
            height: 60px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .navbar-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .navbar-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .navbar-button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .navbar-button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .theme-toggle {
            position: relative;
            width: 48px;
            height: 28px;
            background: var(--bg-tertiary);
            border-radius: 14px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            padding: 2px;
            transition: all 0.3s ease;
        }

        .theme-toggle.dark {
            background: #2d3748;
        }

        .theme-toggle-circle {
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .theme-toggle.dark .theme-toggle-circle {
            transform: translateX(20px);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Tabs */
        .module-tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            overflow-y: hidden;
            flex-shrink: 0;
            padding: 0 12px;
        }

        .module-tabs::-webkit-scrollbar {
            height: 4px;
        }

        .module-tabs::-webkit-scrollbar-track {
            background: transparent;
        }

        .module-tabs::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .module-tab {
            padding: 12px 16px;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            position: relative;
            transition: color 0.2s ease;
        }

        .module-tab:hover {
            color: var(--text-primary);
        }

        .module-tab.active {
            color: #ff6b6b;
        }

        .module-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: #ff6b6b;
        }

        .module-tab-close {
            margin-left: 8px;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s ease;
        }

        .module-tab-close:hover {
            color: var(--text-primary);
        }

        /* Module Content Container */
        .modules-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .module-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .module-content.active {
            opacity: 1;
            visibility: visible;
        }

        .module-content::-webkit-scrollbar {
            width: 8px;
        }

        .module-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .module-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .module-content::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Status Bar */
        .status-bar {
            height: 32px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 12px;
            color: var(--text-tertiary);
            flex-shrink: 0;
        }

        .status-bar-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 24px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .sidebar {
                position: absolute;
                height: 100%;
                left: 0;
                top: 0;
                box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
            }

            .sidebar.collapsed {
                width: 0;
                opacity: 0;
            }

            .app-container.sidebar-open .sidebar {
                width: 280px;
            }

            .main-content {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .app-container {
                flex-direction: column;
            }

            .sidebar-menu {
                display: none;
                padding: 0;
            }

            .sidebar.expanded .sidebar-menu {
                display: block;
            }

            .navbar {
                padding: 0 16px;
            }

            .navbar-title {
                font-size: 14px;
            }
        }
    </style>
</head>

    <script>
        // ===== Main Application Controller =====
        class AppController {
            constructor() {
                this.activeModules = new Map();
                this.currentModule = 'dashboard';
                this.theme = this.getTheme();
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.setupTheme();
                this.loadModule('dashboard');
            }

            setupEventListeners() {
                // Sidebar toggle
                document.getElementById('sidebarToggle').addEventListener('click', () => {
                    this.toggleSidebar();
                });

                // Navbar menu toggle (for mobile)
                document.getElementById('navbarMenuToggle').addEventListener('click', () => {
                    this.toggleSidebar();
                });

                // Theme toggle
                document.getElementById('themeToggle').addEventListener('click', () => {
                    this.toggleTheme();
                });

                // Menu items
                document.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        const module = e.currentTarget.dataset.module;
                        this.loadModule(module);
                    });
                });

                // Settings
                document.getElementById('settingsBtn').addEventListener('click', () => {
                    this.loadModule('settings');
                });

                // Notification button
                document.getElementById('notificationBtn').addEventListener('click', () => {
                    this.showNotifications();
                });
            }

            loadModule(moduleName) {
                // Update sidebar active state
                document.querySelectorAll('.menu-item').forEach(item => {
                    item.classList.remove('active');
                });
                document.querySelector(`[data-module="${moduleName}"]`)?.classList.add('active');

                // If module already loaded, just show it
                if (this.activeModules.has(moduleName)) {
                    this.showModule(moduleName);
                    return;
                }

                // Load module HTML
                fetch(`modules/${moduleName}/${moduleName}.html`)
                    .then(response => response.text())
                    .then(html => {
                        const container = document.getElementById('modulesContainer');
                        const moduleDiv = document.createElement('div');
                        moduleDiv.className = 'module-content';
                        moduleDiv.id = `module-${moduleName}`;
                        moduleDiv.innerHTML = html;
                        container.appendChild(moduleDiv);

                        // Add to active modules
                        this.activeModules.set(moduleName, moduleDiv);

                        // Initialize module if it has an init function
                        if (window[`init${this.camelCase(moduleName)}`]) {
                            window[`init${this.camelCase(moduleName)}`]();
                        }

                        // Add tab
                        this.addTab(moduleName);

                        // Show module
                        this.showModule(moduleName);

                        // Update navbar title
                        this.updateNavbarTitle(moduleName);
                    })
                    .catch(err => console.error(`Failed to load module ${moduleName}:`, err));
            }

            showModule(moduleName) {
                // Hide all modules
                document.querySelectorAll('.module-content').forEach(mod => {
                    mod.classList.remove('active');
                });

                // Show selected module
                document.getElementById(`module-${moduleName}`)?.classList.add('active');

                // Update tabs
                document.querySelectorAll('.module-tab').forEach(tab => {
                    tab.classList.remove('active');
                });
                document.querySelector(`[data-tab="${moduleName}"]`)?.classList.add('active');

                this.currentModule = moduleName;
                this.updateNavbarTitle(moduleName);
            }

            addTab(moduleName) {
                const tabsContainer = document.getElementById('moduleTabs');
                
                // Check if tab already exists
                if (document.querySelector(`[data-tab="${moduleName}"]`)) {
                    return;
                }

                const tab = document.createElement('button');
                tab.className = 'module-tab active';
                tab.dataset.tab = moduleName;
                tab.innerHTML = `
                    <span>${this.formatModuleName(moduleName)}</span>
                    <span class="module-tab-close">✕</span>
                `;

                // Click to show module
                tab.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('module-tab-close')) {
                        this.showModule(moduleName);
                    }
                });

                // Close tab
                tab.querySelector('.module-tab-close').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.closeTab(moduleName);
                });

                tabsContainer.appendChild(tab);
            }

            closeTab(moduleName) {
                const tab = document.querySelector(`[data-tab="${moduleName}"]`);
                tab?.remove();

                this.activeModules.delete(moduleName);

                // If closed module was active, switch to another
                if (this.currentModule === moduleName) {
                    const remaining = Array.from(this.activeModules.keys());
                    if (remaining.length > 0) {
                        this.showModule(remaining[0]);
                    } else {
                        this.loadModule('dashboard');
                    }
                }
            }

            updateNavbarTitle(moduleName) {
                document.getElementById('navbarTitle').textContent = this.formatModuleName(moduleName);
            }

            formatModuleName(moduleName) {
                return moduleName
                    .split('-')
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(' ');
            }

            camelCase(str) {
                return str
                    .split('-')
                    .map((word, index) => {
                        if (index === 0) return word;
                        return word.charAt(0).toUpperCase() + word.slice(1);
                    })
                    .join('');
            }

            toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('collapsed');
                this.saveSidebarState(sidebar.classList.contains('collapsed'));
            }

            toggleTheme() {
                const newTheme = this.theme === 'light' ? 'dark' : 'light';
                this.setTheme(newTheme);
                this.theme = newTheme;
            }

            setupTheme() {
                document.documentElement.dataset.theme = this.theme;
                const toggle = document.getElementById('themeToggle');
                if (this.theme === 'dark') {
                    toggle.classList.add('dark');
                }
            }

            getTheme() {
                const saved = localStorage.getItem('app-theme');
                if (saved) return saved;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            setTheme(theme) {
                document.documentElement.dataset.theme = theme;
                localStorage.setItem('app-theme', theme);
                const toggle = document.getElementById('themeToggle');
                if (theme === 'dark') {
                    toggle.classList.add('dark');
                } else {
                    toggle.classList.remove('dark');
                }
            }

            saveSidebarState(isCollapsed) {
                localStorage.setItem('sidebar-collapsed', isCollapsed);
            }

            showNotifications() {
                alert('📬 No new notifications');
            }
        }

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            window.app = new AppController();
        });

        // Update last sync time
        setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            document.getElementById('lastSyncTime').textContent = `Last sync: ${timeStr}`;
        }, 60000);
    </script>
</body>

</html>
