<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FujiSan Lanka ERP - Hummingbird Clothing</title>

    <!-- Global Styles -->
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/theme.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/forms.css">
    <link rel="stylesheet" href="./assets/css/tables.css">
    <link rel="stylesheet" href="./assets/css/modals.css">
    <link rel="stylesheet" href="./assets/css/animations.css">

    <!-- Module Styles -->
    <link rel="stylesheet" href="./modules/dashboard/dashboard.css">
    <link rel="stylesheet" href="./modules/sub-garments/sub-garments.css">
    <link rel="stylesheet" href="./modules/customers/customers.css">
    <link rel="stylesheet" href="./modules/suppliers/suppliers.css">
    <link rel="stylesheet" href="./modules/inventory/inventory.css">
    <link rel="stylesheet" href="./modules/production-costing/production-costing.css">
    <link rel="stylesheet" href="./modules/expenses/expenses.css">
    <link rel="stylesheet" href="./modules/staff/staff.css">
    <link rel="stylesheet" href="./modules/reports/reports.css">
    <link rel="stylesheet" href="./modules/cheque-tracker/cheque-tracker.css">
    <link rel="stylesheet" href="./modules/settings/settings.css">

    <style>
        /* Main Layout Structure */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            background: var(--bg-primary);
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 100;
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        .sidebar.collapsed .sidebar-brand {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        .sidebar-brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c8c 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sidebar-collapse-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .sidebar-collapse-btn:hover {
            background: var(--bg-tertiary);
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            padding: 12px 16px;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--info-color);
            color: white;
            border-left-color: white;
        }

        .sidebar.collapsed .nav-item {
            padding: 12px 8px;
            justify-content: center;
        }

        .sidebar.collapsed .nav-item-label {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-actions {
            display: flex;
            gap: 8px;
        }

        .sidebar-action-btn {
            flex: 1;
            padding: 8px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: 4px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .sidebar-action-btn:hover {
            background: var(--info-color);
            color: white;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .top-bar {
            height: 64px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            gap: 16px;
        }

        .top-bar-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
        }

        .search-box input {
            border: none;
            background: transparent;
            color: var(--text-primary);
            outline: none;
            width: 150px;
        }

        .search-box input::placeholder {
            color: var(--text-tertiary);
        }

        .top-bar-icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 18px;
        }

        .top-bar-icon-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--error-color);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .user-menu:hover {
            background: var(--info-color);
            color: white;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: var(--bg-primary);
        }

        /* Module Container */
        .module-container {
            width: 100%;
            height: 100%;
        }

        .module-container.hidden {
            display: none;
        }

        /* Status Bar */
        .status-bar {
            height: 40px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-bar-left,
        .status-bar-right {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        /* Loading Indicator */
        .app-loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 16px;
        }

        .app-loading.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--info-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scroll-track);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }
    </style>
</head>

<body>
    <!-- Loading Indicator -->
    <div class="app-loading" id="appLoading">
        <div class="spinner"></div>
        <div class="loading-text">Initializing Hummingbird ERP...</div>
    </div>

    <!-- Main App Container -->
    <div class="app-container" id="appContainer" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="sidebar-brand-icon">🐦</div>
                    <span>Hummingbird</span>
                </div>
                <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Toggle Sidebar">
                    ☰
                </button>
            </div>

            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Nav items will be populated by JavaScript -->
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-actions">
                    <button class="sidebar-action-btn" id="themeToggle" title="Toggle Theme">
                        🌙 Theme
                    </button>
                    <button class="sidebar-action-btn" id="settingsBtn" title="Settings">
                        ⚙️ Settings
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="top-bar-title" id="pageTitle">Dashboard</div>

                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" placeholder="Search..." id="globalSearch">
                </div>

                <div class="top-bar-actions">
                    <button class="top-bar-icon-btn" id="notificationsBtn" title="Notifications">
                        🔔
                        <span class="notification-badge">3</span>
                    </button>
                    <button class="top-bar-icon-btn" id="refreshBtn" title="Refresh">
                        🔄
                    </button>
                    <div class="user-menu" id="userMenu">
                        <div class="user-avatar">U</div>
                        <span>User</span>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Module content will be loaded here -->
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-bar-left">
                    <span>Ready</span>
                    <span id="lastSyncTime">Last sync: --:--:--</span>
                </div>
                <div class="status-bar-right">
                    <span id="statusMessage">Connected</span>
                </div>
            </div>
        </div>
    </div>

    <!-- UTILITY SCRIPTS (Load First) -->
    <script src="./utils/storage.js"></script>
    <script src="./utils/calculations.js"></script>
    <script src="./utils/formatter.js"></script>
    <script src="./utils/export.js"></script>
    <script src="./utils/pdf-generator.js"></script>
    <script src="./utils/pdf-styles.js"></script>
    <script src="./utils/excel-exporter.js"></script>

    <!-- SYSTEM SCRIPTS (Load Second) -->
    <script src="./systems/backup-restore.js"></script>
    <script src="./systems/theme-manager.js"></script>
    <script src="./systems/app-config.js"></script>

    <!-- MODULE SCRIPTS (Load Third) -->
    <script src="./modules/dashboard/dashboard.js"></script>
    <script src="./modules/sub-garments/sub-garments.js"></script>
    <script src="./modules/customers/customers.js"></script>
    <script src="./modules/suppliers/suppliers.js"></script>
    <script src="./modules/inventory/inventory.js"></script>
    <script src="./modules/production-costing/production-costing.js"></script>
    <script src="./modules/expenses/expenses.js"></script>
    <script src="./modules/staff/staff.js"></script>
    <script src="./modules/reports/reports.js"></script>
    <script src="./modules/cheque-tracker/cheque-tracker.js"></script>
    <script src="./modules/settings/settings.js"></script>

    <!-- MAIN APP INITIALIZATION (Load Last) -->
    <script>
        /**
         * Main Application Controller
         * Handles initialization, module loading, and UI management
         */
        class AppController {
            constructor() {
                this.currentModule = 'dashboard';
                this.modules = {
                    dashboard: DashboardModule,
                    subGarments: SubGarmentsModule,
                    customers: CustomersModule,
                    suppliers: SuppliersModule,
                    inventory: InventoryModule,
                    productionCosting: ProductionCostingModule,
                    expenses: ExpensesModule,
                    staff: StaffModule,
                    reports: ReportsModule,
                    chequeTracker: ChequeTrackerModule,
                    settings: SettingsModule
                };
                this.theme = 'light';
                this.moduleInstances = {};
                this.init();
            }

            async init() {
                try {
                    console.log('🚀 Initializing Hummingbird ERP...');

                    // Wait for storage to be ready
                    await this.waitForStorageReady();
                    console.log('✅ Storage ready');

                    // Initialize theme
                    this.setupTheme();
                    console.log('✅ Theme loaded');

                    // Load sample data if needed
                    await this.loadSampleDataIfNeeded();
                    console.log('✅ Data loaded');

                    // Setup UI
                    this.setupNavigation();
                    console.log('✅ Navigation setup');

                    // Load initial module
                    await this.loadModule(this.currentModule);
                    console.log('✅ Dashboard loaded');

                    // Setup event listeners
                    this.setupEventListeners();
                    console.log('✅ Event listeners setup');

                    // Show app, hide loading
                    this.showApp();
                    console.log('✅ App initialized successfully!');
                } catch (error) {
                    console.error('❌ Initialization error:', error);
                    this.showError(`Failed to initialize: ${error.message}`);
                }
            }

            /**
             * Wait for storage to be initialized (with timeout)
             */
            waitForStorageReady() {
                return new Promise((resolve, reject) => {
                    let attempts = 0;
                    const maxAttempts = 20; // 2 seconds with 100ms intervals
                    const checkInterval = setInterval(() => {
                        attempts++;

                        // Check if storage is ready
                        if (typeof storage !== 'undefined' && storage.db) {
                            clearInterval(checkInterval);
                            resolve();
                        } else if (attempts >= maxAttempts) {
                            clearInterval(checkInterval);
                            reject(new Error('Storage initialization timeout'));
                        }
                    }, 100);
                });
            }

            /**
             * Load sample data on first run
             */
            async loadSampleDataIfNeeded() {
                try {
                    const hasData = await storage.readAll('subGarments');
                    if (hasData && hasData.length > 0) {
                        return; // Data already exists
                    }

                    // Load sample data
                    console.log('Loading sample data...');
                    const response = await fetch('./data/sample-data.json');
                    const sampleData = await response.json();

                    // Store sample data
                    for (const [storeName, items] of Object.entries(sampleData)) {
                        if (Array.isArray(items)) {
                            for (const item of items) {
                                try {
                                    await storage.create(storeName, item);
                                } catch (e) {
                                    // Item might already exist, continue
                                }
                            }
                        }
                    }

                    console.log('✅ Sample data loaded');
                } catch (error) {
                    console.warn('Could not load sample data:', error);
                    // Non-critical error, continue without sample data
                }
            }

            /**
             * Setup navigation menu
             */
            setupNavigation() {
                const navContainer = document.getElementById('sidebarNav');
                navContainer.innerHTML = '';

                const navItems = [
                    { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                    { id: 'subGarments', label: 'Sub Garments', icon: '👕' },
                    { id: 'customers', label: 'Customers', icon: '👥' },
                    { id: 'suppliers', label: 'Suppliers', icon: '🏭' },
                    { id: 'inventory', label: 'Inventory', icon: '📦' },
                    { id: 'productionCosting', label: 'Production Costing', icon: '💰' },
                    { id: 'expenses', label: 'Expenses', icon: '💸' },
                    { id: 'staff', label: 'Staff', icon: '👔' },
                    { id: 'reports', label: 'Reports', icon: '📋' },
                    { id: 'chequeTracker', label: 'Cheque Tracker', icon: '🏦' }
                ];

                navItems.forEach(item => {
                    const navItem = document.createElement('div');
                    navItem.className = `nav-item ${item.id === this.currentModule ? 'active' : ''}`;
                    navItem.innerHTML = `
                        <span>${item.icon}</span>
                        <span class="nav-item-label">${item.label}</span>
                    `;
                    navItem.addEventListener('click', () => this.loadModule(item.id));
                    navContainer.appendChild(navItem);
                });
            }

            /**
             * Load a module
             */
            async loadModule(moduleName) {
                try {
                    console.log(`Loading module: ${moduleName}`);

                    // Update active nav item
                    document.querySelectorAll('.nav-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    event?.target?.closest('.nav-item')?.classList.add('active');

                    // Create module instance if not exists
                    if (!this.moduleInstances[moduleName]) {
                        const ModuleClass = this.modules[moduleName];
                        if (!ModuleClass) {
                            throw new Error(`Module not found: ${moduleName}`);
                        }
                        this.moduleInstances[moduleName] = new ModuleClass();
                    }

                    // Update title
                    const titles = {
                        dashboard: 'Dashboard',
                        subGarments: 'Sub Garments',
                        customers: 'Customers',
                        suppliers: 'Suppliers',
                        inventory: 'Inventory',
                        productionCosting: 'Production Costing',
                        expenses: 'Expenses',
                        staff: 'Staff',
                        reports: 'Reports',
                        chequeTracker: 'Cheque Tracker',
                        settings: 'Settings'
                    };
                    document.getElementById('pageTitle').textContent = titles[moduleName] || 'Module';

                    this.currentModule = moduleName;
                    console.log(`✅ Loaded: ${moduleName}`);
                } catch (error) {
                    console.error(`❌ Failed to load module: ${moduleName}`, error);
                    this.showError(`Failed to load ${moduleName}`);
                }
            }

            /**
             * Setup event listeners
             */
            setupEventListeners() {
                // Sidebar collapse
                document.getElementById('sidebarCollapseBtn')?.addEventListener('click', () => {
                    this.toggleSidebar();
                });

                // Theme toggle
                document.getElementById('themeToggle')?.addEventListener('click', () => {
                    this.toggleTheme();
                });

                // Notifications
                document.getElementById('notificationsBtn')?.addEventListener('click', () => {
                    this.showNotifications();
                });

                // Refresh button
                document.getElementById('refreshBtn')?.addEventListener('click', () => {
                    window.location.reload();
                });

                // Settings button
                document.getElementById('settingsBtn')?.addEventListener('click', () => {
                    this.loadModule('settings');
                });

                // User menu
                document.getElementById('userMenu')?.addEventListener('click', () => {
                    alert('User menu clicked');
                });

                // Global search
                document.getElementById('globalSearch')?.addEventListener('input', (e) => {
                    console.log('Search:', e.target.value);
                });
            }

            /**
             * Show app (hide loading screen)
             */
            showApp() {
                document.getElementById('appLoading').classList.add('hidden');
                document.getElementById('appContainer').style.display = 'flex';
            }

            /**
             * Show error message
             */
            showError(message) {
                const loading = document.getElementById('appLoading');
                loading.querySelector('.spinner').style.display = 'none';
                loading.querySelector('.loading-text').textContent = `Error: ${message}`;
            }

            /**
             * Toggle sidebar collapse
             */
            toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('collapsed');
                localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed'));
            }

            /**
             * Toggle theme
             */
            toggleTheme() {
                const newTheme = this.theme === 'light' ? 'dark' : 'light';
                this.setTheme(newTheme);
                this.theme = newTheme;
            }

            /**
             * Setup theme from saved preference
             */
            setupTheme() {
                this.theme = this.getTheme();
                document.documentElement.dataset.theme = this.theme;
                const toggle = document.getElementById('themeToggle');
                if (this.theme === 'dark') {
                    toggle.classList.add('dark');
                }
            }

            /**
             * Get saved theme or system preference
             */
            getTheme() {
                const saved = localStorage.getItem('app-theme');
                if (saved) return saved;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            /**
             * Set theme and save
             */
            setTheme(theme) {
                document.documentElement.dataset.theme = theme;
                localStorage.setItem('app-theme', theme);
                const toggle = document.getElementById('themeToggle');
                if (theme === 'dark') {
                    toggle.classList.add('dark');
                } else {
                    toggle.classList.remove('dark');
                }
            }

            /**
             * Show notifications
             */
            showNotifications() {
                alert('📬 No new notifications');
            }
        }

        /**
         * Initialize app when all scripts are loaded
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Small delay to ensure all scripts are loaded
            setTimeout(() => {
                window.app = new AppController();
            }, 500);
        });

        /**
         * Update last sync time every minute
         */
        setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            const syncElement = document.getElementById('lastSyncTime');
            if (syncElement) {
                syncElement.textContent = `Last sync: ${timeStr}`;
            }
        }, 60000);
    </script>
</body>

</html>
